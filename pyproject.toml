[project]
name = "ticket-agent"
version = "0.1.0"
description = "Guarded tool-use chat agent over a multi-tenant ticket system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic-settings",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The test package imports like the application package, not like a dependency.
known-first-party = ["ticket_agent", "tests"]

[tool.pytest.ini_options]
# Every test lives under tests/; the suite needs no network and no API key.
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# Measured over the installed package; the developer utilities (seed data, dump,
# probe) and the uvicorn entry point are not part of the running system.
source = ["ticket_agent"]
omit = ["*/ticket_agent/utils/*", "*/ticket_agent/__main__.py"]

[tool.coverage.report]
# `make test` fails below this line coverage.
fail_under = 80
show_missing = true
skip_covered = true
